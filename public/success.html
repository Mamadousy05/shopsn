<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement confirmé — SHOPSN</title>
<style>
  body{font-family:'Work Sans',sans-serif;background:#FAF6EF;color:#1F1B16;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:20px;}
  .box{background:#fff;border:1px solid #E4DCC9;border-radius:10px;padding:40px 32px;max-width:420px;}
  .icon{font-size:52px;margin-bottom:12px;}
  h1{font-size:22px;color:#14213D;margin:0 0 10px;}
  p{color:#5B5346;font-size:14.5px;line-height:1.6;}
  a.btn{display:inline-block;margin-top:20px;background:#14213D;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:600;font-size:14px;}
  .order-id{font-size:12px;color:#5B5346;margin-top:16px;word-break:break-all;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>Paiement en cours de confirmation</h1>
    <p>Merci ! Votre paiement a été transmis. Votre commande passera automatiquement au statut "Paiement confirmé" dès que la confirmation officielle sera reçue (généralement en quelques secondes).</p>
    <a class="btn" href="/">Retour à la boutique</a>
    <div class="order-id" id="orderIdDisplay"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order');
    if(orderId){
      document.getElementById('orderIdDisplay').textContent = 'Référence commande : ' + orderId;
    }
  </script>
</body>
</html>
