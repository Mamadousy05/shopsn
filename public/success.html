<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement confirmé — SHOPSN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230E3B2E'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23D8A448' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Work Sans',sans-serif;background:#FAF7F1;color:#20241F;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:20px;}
  .box{background:#fff;border:1px solid #E6DFD1;border-radius:10px;padding:40px 32px;max-width:420px;}
  a.btn.secondary{background:transparent;color:#0E3B2E;border:1px solid #E6DFD1;}
  .icon{font-size:52px;margin-bottom:12px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:#0E3B2E;margin:0 0 10px;}
  p{color:#5C665C;font-size:14.5px;line-height:1.6;}
  a.btn{display:inline-block;margin:20px 4px 0;background:#0E3B2E;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:600;font-size:14px;}
  .order-id{font-size:12px;color:#5C665C;margin-top:16px;word-break:break-all;}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>Paiement en cours de confirmation</h1>
    <p>Merci ! Votre paiement a été transmis. Votre commande passera automatiquement au statut "Paiement confirmé" dès que la confirmation officielle sera reçue (généralement en quelques secondes).</p>
    <a class="btn" href="/">Retour à la boutique</a>
    <a class="btn secondary" href="/" onclick="sessionStorage.setItem('openOrders','1')">Mes commandes</a>
    <div class="order-id" id="orderIdDisplay"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order');
    if(orderId){
      document.getElementById('orderIdDisplay').textContent = 'Référence commande : ' + orderId;
    }
  </script>
</body>
</html>
